[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stratlab"
version = "0.1.0"
description = "StratégieLab : terminal quant hors ligne (données locales, backtests, portefeuille, IA locale optionnelle)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pandas>=2.1",
  "numpy>=1.26",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]
online = ["yfinance>=0.2.40"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
stratlab = "stratlab.__main__:main"

[tool.setuptools.packages.find]
include = ["stratlab*"]

[tool.setuptools.package-data]
stratlab = ["web/*", "web/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
